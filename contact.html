<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/index.css">
    <title>Contact Document</title>
</head>
<body>
    <header class="navbar">
        <div>
            <svg viewBox="0 0 91 20" width="91" height="20">
                <use href="Images/Logo.svg#correct"></use>
            </svg>
        </div>
        <div>
            <nav class="nav-links">
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <section class="Contact-section">
        <div class="contact-info">
            <h2 class="contact-title">Full set of great features to make your product fresh</h2>
            <p class="contact-text">Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
        </div>
        <div class="contact-form">
            <div class="form-group">
                <input type="text" placeholder="Name" required>
            </div>

            <div class="form-group">
                <input type="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <textarea placeholder="Message" required></textarea>
            </div>
             <button type="submit" class="submit-btn">Submit</button>   
        </div>

        
    </section>

    <section class="map">
        <div class="map-container">
            <img src="images/Map.png" alt="Map">
        </div>
    </section>
    

    <section class="footer">
        <div>
            <svg viewBox="0 0 91 20" width="91" height="20">
                <use href="Images/Logo.svg#correct"></use>
            </svg>
        </div>
        <div>
            <nav class="nav-links">
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        <div>
            <svg viewBox="0 0 95 15" width="95" height="15">
                <use href="Images/Social.svg#correct"></use>
            </svg>
        </div>

    </section>
</body>
</html>
