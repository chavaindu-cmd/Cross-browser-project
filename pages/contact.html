<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="stylesheet" href="../styles/index.css">
    <title>Contact Document</title>
</head>
<body class="bodyval">
    <header class="navbar">
        <a href="../index.html" class="logo-home-btn" aria-label="Go to homepage">
            <div>
                <svg viewBox="0 0 91 20" width="91" height="20">
                    <use href="../Images/Logo.svg#correct"></use>
                </svg>
            </div>
        </a>
        <div>
            <nav class="nav-links">
                <a href="../pages/project.html"  class="nav-item">Projects</a>
                <a href="#contact"  class="nav-item">Contact</a>
            </nav>
        </div>
    </header>

    <section class="Contact-section">
        <div class="contact-info">
            <h2 class="contact-title">Full set of great features to make your product fresh</h2>
            <p class="contact-text">Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
        </div>
        <form class="contact-form">
            <div class="form-group">
                <input type="text" placeholder="Name" required>
            </div>

            <div class="form-group">
                <input type="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <textarea placeholder="Message" required></textarea>
            </div>
             <button type="submit" class="submit-btn">Submit</button>   
        </form>

        
    </section>

    <section class="map">
        <div class="map-container">
            <img src="../images/Map.png" alt="Map">
        </div>
    </section>
    

    <section class="footer">
        <a href="../index.html" class="logo-home-btn" aria-label="Go to homepage">
            <div>
                <svg viewBox="0 0 91 20" width="91" height="20">
                    <use href="../Images/Logo.svg#correct"></use>
                </svg>
            </div>
        </a>
        <div>
            <nav class="nav-links">
                <a href="../pages/project.html"  class="nav-item">Projects</a>
                <a href="#contact"  class="nav-item">Contact</a>
            </nav>
        </div>
        <div class= "footerimages">
            <i class="fa-solid fa-basketball"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-twitter"></i>
        </div>
        
    </section>
</body>
</html>
